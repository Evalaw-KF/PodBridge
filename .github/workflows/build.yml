name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test tests/PodBridge.Core.Tests --configuration Release

  build-app:
    name: Build app (${{ matrix.arch }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained)
        shell: pwsh
        run: >
          dotnet publish src/PodBridge.App/PodBridge.App.csproj
          --configuration Release
          --runtime win-${{ matrix.arch }}
          --self-contained true
          -p:Platform=${{ matrix.platform }}
          --output publish/win-${{ matrix.arch }}

      - name: Check the published files
        shell: pwsh
        run: |
          # Fail here, not on the user's PC, if the app folder is incomplete.
          $dir = "publish/win-${{ matrix.arch }}"
          $missing = @()
          foreach ($f in @("PodBridge.exe", "PodBridge.dll", "PodBridge.Core.dll", "Microsoft.WinUI.dll",
                           "Microsoft.ui.xaml.dll", "Microsoft.WindowsAppRuntime.dll", "coreclr.dll")) {
            if (-not (Test-Path (Join-Path $dir $f))) { $missing += $f }
          }
          if (-not (Get-ChildItem -Path $dir -Filter *.pri)) { $missing += "*.pri (XAML resources)" }
          if ($missing.Count -gt 0) {
            Get-ChildItem $dir | Select-Object -ExpandProperty Name
            throw "Published app is missing: $($missing -join ', ')"
          }
          "Published files look complete."

      - name: Add a short read-me to the zip
        shell: pwsh
        run: |
          @"
          PodBridge
          =========
          1. Unzip this whole folder somewhere (for example, Documents).
          2. Double-click PodBridge.exe.
          3. Open your AirPods case lid near the PC. PodBridge lives in the system tray (near the clock).

          Nothing needs to be installed. More help: https://github.com/${{ github.repository }}#readme
          "@ | Set-Content -Path publish/win-${{ matrix.arch }}/READ-ME-FIRST.txt -Encoding utf8

      - name: Create zip
        shell: pwsh
        run: |
          $name = "PodBridge-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-win-${{ matrix.arch }}.zip"
          Compress-Archive -Path "publish/win-${{ matrix.arch }}/*" -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodBridge-win-${{ matrix.arch }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
